# Optional local development shortcut; not a claim of Sprint 4 completion.
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: demo_root_password
      MYSQL_DATABASE: stockwise
      MYSQL_USER: stockwise
      MYSQL_PASSWORD: demo_stockwise_password
    ports:
      - "3307:3306"
    volumes:
      - stockwise_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: stockwise
      DB_PASSWORD: demo_stockwise_password
      DB_NAME: stockwise
    depends_on:
      db:
        condition: service_healthy
volumes:
  stockwise_data:
